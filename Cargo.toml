[package]
name = "x86mcp"
version = "0.1.0"
edition = "2024"
description = "Cited Intel SDM and AMD APM retrieval over MCP"
repository = "https://github.com/sa413x/x86mcp"
homepage = "https://github.com/sa413x/x86mcp"
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1"
atomic-write-file = "0.3"
base64 = "0.22"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
# ORT 1.22 prebuilts cover every configured cargo-dist target, including Intel macOS.
fastembed = { version = "=5.6.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
memmap2 = "0.9"
parking_lot = "0.12"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1"
regex = "1"
rmcp = { version = "3.0.0", features = ["transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tantivy = { version = "0.26.1", default-features = false, features = ["lz4-compression", "mmap", "stemmer"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.3"
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
rmcp = { version = "3.0.0", features = ["client", "transport-child-process"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
